{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      {{ if not .Date.IsZero }}
        <p class="post-date">{{ .Date.Format "2006 年 1 月 2 日" }}</p>
      {{ end }}
    </header>
    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
