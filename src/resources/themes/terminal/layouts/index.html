{{ define "main" }}
  <section class="post-list">
    <h2 class="section-title"><span class="section-prefix">##</span> 最新文章</h2>
    <ul>
      {{ range first 20 (where .Site.RegularPages "Section" "posts") }}
        <li>
          <a class="post-link" href="{{ .Permalink }}">{{ .Title }}</a>
          <span class="post-date">[{{ .Date.Format "2006-01-02" }}]</span>
        </li>
      {{ else }}
        <li class="empty">// 还没有文章，在 hugomd 左侧新建一个吧。</li>
      {{ end }}
    </ul>
  </section>
{{ end }}
