{{ define "main" }}
  <section class="post-list">
    <h2 class="section-title"><span class="section-prefix">##</span> {{ .Title }}</h2>
    <ul>
      {{ range .Pages }}
        <li>
          <a class="post-link" href="{{ .Permalink }}">{{ .Title }}</a>
          <span class="post-date">[{{ .Date.Format "2006-01-02" }}]</span>
        </li>
      {{ else }}
        <li class="empty">// 暂无内容。</li>
      {{ end }}
    </ul>
  </section>
{{ end }}
