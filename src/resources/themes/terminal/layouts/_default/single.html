{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1 class="post-title"><span class="hash"># </span>{{ .Title }}</h1>
      {{ if not .Date.IsZero }}
        <time class="post-date">// {{ .Date.Format "2006-01-02 15:04" }}</time>
      {{ end }}
    </header>
    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
