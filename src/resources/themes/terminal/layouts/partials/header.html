<header class="site-header">
  <div class="prompt-line">
    <span class="prompt-user">hh</span><span class="prompt-sep">@</span><span class="prompt-host">{{ .Site.Title }}</span>
    <span class="prompt-path">~{{ .RelPermalink }}</span>
    <span class="prompt-sigil">$</span>
    <span class="prompt-cmd">cat README</span>
  </div>
  <h1 class="site-title"><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
  <nav class="site-nav">
    {{ range .Site.Menus.main }}
      <a href="{{ .URL | relURL }}"><span class="nav-prefix">./</span>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
